<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펫 드라이브 보호자 화면 데모</title>
<link rel="stylesheet" href="../design/screens/base.css">
<style>
  body { background: #EDEEF2; display: flex; gap: 40px; justify-content: center; align-items: flex-start; padding: 32px; }
  .phone { width: 390px; height: 844px; background: #fff; border-radius: 44px; box-shadow: 0 0 0 10px #131417; padding: 18px 24px 28px; display: flex; flex-direction: column; overflow: hidden; }
  .bar { display: flex; justify-content: space-between; font-size: 15px; font-weight: 600; padding: 2px 4px 14px; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 700; }
  .state i { width: 10px; height: 10px; border-radius: 50%; background: var(--active); }
  .sub { font-size: 15px; color: var(--basic-500); margin-top: 4px; }
  .alert { display: none; background: #FFF3F0; border-radius: 16px; padding: 14px 16px; margin-top: 12px; }
  .alert b { display: block; font-size: 19px; color: var(--negative); }
  .alert span { font-size: 14px; color: var(--basic-700); }
  .danger .alert { display: block; }
  .danger .state { color: var(--negative); }
  .danger .state i { background: var(--negative); }
  .ringbox { position: relative; width: 260px; height: 260px; margin: 18px auto 0; }
  .ringbox svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ringbox circle { transition: stroke-dashoffset .6s; }
  .rc { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .rt { font-size: 80px; font-weight: 700; letter-spacing: -3px; line-height: .9; }
  .rt sup { font-size: 26px; color: var(--basic-400); vertical-align: 38px; letter-spacing: 0; }
  .danger .rt { color: var(--negative); }
  .rl { font-size: 14px; color: var(--basic-500); margin-top: 8px; }
  .rn { font-size: 14px; font-weight: 700; color: var(--active); margin-top: 4px; }
  .danger .rn { color: var(--negative); }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 18px; border-top: 1px solid var(--basic-100); border-bottom: 1px solid var(--basic-100); }
  .row3 div { padding: 12px 0; text-align: center; }
  .row3 div + div { border-left: 1px solid var(--basic-100); }
  .row3 span { display: block; font-size: 12px; color: var(--basic-500); }
  .row3 b { font-size: 20px; }
  .chart-h { display: flex; justify-content: space-between; font-size: 13px; color: var(--basic-500); margin-top: 16px; }
  svg.chart { display: block; margin-top: 6px; }
  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }
  .btn { height: 52px; font-size: 16px; border-radius: 14px; cursor: pointer; }
  .danger .btn.filled { background: var(--negative); }
  .ctl { width: 320px; }
  .ctl h1 { font-size: 26px; font-weight: 800; }
  .ctl p { font-size: 15px; color: var(--basic-500); margin-top: 8px; line-height: 1.6; }
  .ctl button { font: inherit; font-size: 15px; font-weight: 700; height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #131417; color: #fff; cursor: pointer; margin-top: 16px; display: block; width: 100%; }
  .ctl button.light { background: #fff; color: #131417; box-shadow: 0 0 0 1px var(--basic-200); }
  .log { margin-top: 20px; font-size: 13px; color: var(--basic-700); background: #fff; border-radius: 12px; padding: 12px 14px; max-height: 300px; overflow: auto; line-height: 1.7; }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="bar"><span id="clock">13:22</span><span>5G</span></div>
  <div class="state"><i></i><span id="stateText">펫 지킴이 작동 중</span></div>
  <div class="sub">덕평자연휴게소, 문 잠김</div>
  <div class="alert"><b>차 안이 더워지고 있어요. 지금 차로 돌아가 주세요</b><span id="alertSub"></span></div>
  <div class="ringbox">
    <svg width="260" height="260"><circle cx="130" cy="130" r="119" stroke="#EDEEF2" stroke-width="22" fill="none"/>
      <circle id="arc" cx="130" cy="130" r="119" stroke="#02C265" stroke-width="22" fill="none" stroke-linecap="round" stroke-dasharray="747.7" stroke-dashoffset="0"/></svg>
    <div class="rc"><div class="rt" id="temp">24.5<sup>℃</sup></div><div class="rl">콩이가 있는 차 안</div><div class="rn" id="next">다음 확인까지 20분</div></div>
  </div>
  <div class="row3"><div><span>떠난 지</span><b id="gone">0분</b></div><div><span>에어컨</span><b id="ac">켜짐</b></div><div><span>바깥</span><b>33℃</b></div></div>
  <div class="chart-h"><span>차 안 온도 기록 (1분마다)</span><span>27℃ 넘으면 알림</span></div>
  <svg class="chart" id="chart" width="342" height="90" viewBox="0 0 342 90"></svg>
  <div class="actions"><div class="btn basic" id="share">온도 기록 공유하기</div><div class="btn filled" id="end">펫 지킴이 끄기</div></div>
</div>
<div class="ctl">
  <h1>보호자 화면 데모</h1>
  <p>1초가 1분처럼 흘러요. 차량 앱이 1분마다 보내는 차 안 온도를 서버를 거쳐 받는다고 가정한 화면이에요.</p>
  <button id="stop">에어컨 멈춤 상황 만들기</button>
  <button class="light" id="reset">처음부터</button>
  <div class="log" id="log"></div>
</div>
<script>
const C = 747.7, START = 13 * 60 + 22, LIMIT = 27, CHECK = 20;
let min, temp, acOn, rec, timer;
const $ = id => document.getElementById(id);
const fmt = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
function log(t) { $('log').innerHTML = `<div>${fmt(START + min)}  ${t}</div>` + $('log').innerHTML; }
function draw() {
  const y = t => 8 + (34 - t) * 6;  // 34℃가 맨 위, 1℃ = 6px
  const pts = rec.map((t, i) => `${(i / Math.max(1, rec.length - 1)) * 330},${Math.max(4, Math.min(86, y(t))).toFixed(1)}`).join(' ');
  $('chart').innerHTML = `<line x1="0" y1="${y(LIMIT)}" x2="342" y2="${y(LIMIT)}" stroke="#FE3D16" stroke-opacity=".4" stroke-dasharray="3 5"/>` +
    `<polyline fill="none" stroke="#131417" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/>`;
}
function render() {
  const danger = temp > LIMIT;
  $('phone').classList.toggle('danger', danger);
  $('clock').textContent = fmt(START + min);
  $('temp').innerHTML = `${temp.toFixed(1)}<sup>℃</sup>`;
  $('gone').textContent = `${min}분`;
  $('ac').textContent = acOn ? '켜짐' : '멈춤';
  const left = CHECK - (min % CHECK);
  $('next').textContent = danger ? '보호자를 부르는 중' : `다음 확인까지 ${left}분`;
  $('arc').style.strokeDashoffset = danger ? 0 : C * (1 - left / CHECK);
  $('arc').setAttribute('stroke', danger ? '#FE3D16' : '#02C265');
  $('stateText').textContent = danger ? '펫 지킴이 위험' : '펫 지킴이 작동 중';
  $('alertSub').textContent = `에어컨 멈춤 · 떠난 지 ${min}분`;
  draw();
}
function tick() {
  min += 1;
  temp = acOn ? Math.max(22.0, temp - (temp - 22) * 0.35) + (Math.random() - 0.5) * 0.2 : temp + 0.9;
  rec.push(+temp.toFixed(1)); if (rec.length > 20) rec.shift();
  if (min % CHECK === 0 && acOn) log('20분이 됐어요. 연장할지 보호자에게 물어요');
  if (temp > LIMIT && rec.length > 1 && rec[rec.length - 2] <= LIMIT) log(`차 안 ${temp.toFixed(1)}℃, 위험 알림과 전화를 보냈어요`);
  render();
}
function reset() {
  clearInterval(timer); min = 0; temp = 24.5; acOn = true; rec = [24.5]; $('log').innerHTML = '';
  log('펫 지킴이를 켰어요. 에어컨 22℃, 문 잠금'); render();
  timer = setInterval(tick, 1000);
}
$('stop').onclick = () => { if (acOn) { acOn = false; log('에어컨이 멈췄어요 (데모)'); render(); } };
$('reset').onclick = reset;
$('share').onclick = () => log(`온도 기록 공유: ${fmt(START)}부터 ${rec.length}개 기록, 최고 ${Math.max(...rec).toFixed(1)}℃`);
$('end').onclick = () => { clearInterval(timer); log('보호자가 펫 지킴이를 껐어요'); };
reset();
if (location.search.includes('stop')) setTimeout(() => $('stop').click(), 2500);  // 확인용: ?stop
</script>
</body>
</html>
