<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="ring.css">
<style>
 body{background:#fff}
 .phone{width:390px;height:844px;padding:16px 24px 28px;display:flex;flex-direction:column}
 .bar{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:2px 4px 14px}
 .alert{background:#FFF3F0;border-radius:18px;padding:18px 20px}
 .alert .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--negative)}
 .alert .h i{width:10px;height:10px;border-radius:50%;background:var(--negative)}
 .alert .t{font-size:22px;font-weight:800;margin-top:8px;letter-spacing:-.3px;line-height:1.35}
 .alert .s{font-size:15px;color:var(--basic-700);margin-top:6px;line-height:1.5}
 .ring{margin:24px auto 0}
 .did{list-style:none;margin-top:22px;border-top:1px solid var(--basic-100)}
 .did li{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--basic-100);font-size:16px}
 .did li span{color:var(--basic-500)}
 .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
 .btn{height:56px;font-size:17px;border-radius:14px}
 .btn.red{background:var(--negative);color:#fff}
</style></head><body><div class="phone">
 <div class="bar"><span>13:36</span><span>5G</span></div>
 <div class="alert"><div class="h"><i></i>펫 지킴이 위험</div>
  <div class="t">차 안이 31℃예요.<br>지금 차로 돌아가 주세요</div>
  <div class="s">에어컨 멈춤 · 떠난 지 14분</div></div>
 <div class="ring" style="width:260px;height:260px">
  <svg width="260" height="260" style="transform:rotate(-90deg)">
    <circle cx="130.0" cy="130.0" r="119.0" stroke="#FFE1DA" stroke-width="22" fill="none"/>
    <circle cx="130.0" cy="130.0" r="119.0" stroke="#FE3D16" stroke-width="22" fill="none" stroke-linecap="round" stroke-dasharray="747.7" stroke-dashoffset="0.0"/>
  </svg>
  <div class="rc"><div class="rt" style="font-size:80px;color:#FE3D16">31.0<sup>℃</sup></div><div class="rl" style="font-size:15px;margin-top:6px">콩이가 있는 차 안</div></div>
</div>
 <ul class="did"><li><span>창문</span><b>3cm 열림</b></li><li><span>실내등</span><b>켜짐</b></li><li><span>차 위치</span><b>덕평자연휴게소 주차장</b></li></ul>
 <div class="actions"><div class="btn red">지금 갈게요</div><div class="btn basic">가족에게 대신 부탁하기</div></div>
</div></body></html>
