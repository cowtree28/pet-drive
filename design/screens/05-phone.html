<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="ring.css">
<style>
 body{background:#fff}
 .phone{width:390px;height:844px;padding:16px 24px 28px;display:flex;flex-direction:column}
 .bar{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:2px 4px 14px}
 .state{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
 .state i{width:10px;height:10px;border-radius:50%;background:var(--active)}
 .sub{font-size:15px;color:var(--basic-500);margin-top:4px}
 .ring{margin:26px auto 0}
 .row3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:26px;border-top:1px solid var(--basic-100);border-bottom:1px solid var(--basic-100)}
 .row3 div{padding:14px 0;text-align:center}
 .row3 div+div{border-left:1px solid var(--basic-100)}
 .row3 span{display:block;font-size:13px;color:var(--basic-500)}
 .row3 b{display:block;font-size:22px;margin-top:2px}
 .chart-h{display:flex;justify-content:space-between;font-size:14px;color:var(--basic-500);margin-top:22px}
 svg.chart{display:block;margin-top:8px;flex-shrink:0}
 .actions{margin-top:auto;display:flex;flex-direction:column;gap:8px}
 .btn{height:54px;font-size:17px;border-radius:14px}
</style></head><body><div class="phone">
 <div class="bar"><span>13:28</span><span>5G</span></div>
 <div class="state"><i></i>펫 지킴이 작동 중</div>
 <div class="sub">덕평자연휴게소, 에어컨 켜짐, 문 잠김</div>
 <div class="ring" style="width:300px;height:300px">
  <svg width="300" height="300" style="transform:rotate(-90deg)">
    <circle cx="150.0" cy="150.0" r="139.0" stroke="#EDEEF2" stroke-width="22" fill="none"/>
    <circle cx="150.0" cy="150.0" r="139.0" stroke="#02C265" stroke-width="22" fill="none" stroke-linecap="round" stroke-dasharray="873.4" stroke-dashoffset="262.0"/>
  </svg>
  <div class="rc"><div class="rt" style="font-size:96px">22.1<sup>℃</sup></div><div class="rl" style="font-size:15px;margin-top:8px">콩이가 있는 차 안</div></div>
</div>
 <div class="row3"><div><span>떠난 지</span><b>6분</b></div><div><span>다음 확인까지</span><b>14분</b></div><div><span>바깥</span><b>33℃</b></div></div>
 <div class="chart-h"><span>차 안 온도 기록</span><span>27℃ 넘으면 알림</span></div>
 <svg class="chart" width="342" height="80" viewBox="0 0 342 80">
  <line x1="0" y1="8" x2="342" y2="8" stroke="#C7C9CE" stroke-dasharray="3 5"/>
  <polyline fill="none" stroke="#131417" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="0,38 55,51.2 110,60.8 165,65.6 220,68 275,66.8 330,66.8"/>
  <circle cx="330" cy="66.8" r="4.5" fill="#131417"/>
 </svg>
 <div class="actions"><div class="btn basic">온도 기록 공유하기</div><div class="btn filled">펫 지킴이 끄기</div></div>
</div></body></html>
