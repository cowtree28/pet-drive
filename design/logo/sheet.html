<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Asta;src:url(../screens/fonts/AstaSans.ttf)}
body{margin:0;width:1600px;height:900px;display:grid;grid-template-columns:1fr 1fr;font-family:Asta}
.p{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:72px}
.light{background:#F7F8FA}.dark{background:#131417}
.icon{width:280px;height:280px;border-radius:62px;box-shadow:0 18px 48px rgba(0,0,0,.18)}
.dark .icon{box-shadow:0 0 0 2px #2A2C31}
.lock{display:flex;align-items:center;gap:22px}
.lock img{width:84px;height:84px;border-radius:19px}
.dark .lock img{box-shadow:0 0 0 2px #2A2C31}
.lock b{font-size:64px;font-weight:800;letter-spacing:-1.5px;color:#131417}
.dark .lock b{color:#fff}
</style></head><body>
<div class="p light"><img class="icon" src="logo.svg"><div class="lock"><img src="logo.svg"><b>펫 드라이브</b></div></div>
<div class="p dark"><img class="icon" src="logo.svg"><div class="lock"><img src="logo.svg"><b>펫 드라이브</b></div></div>
</body></html>
