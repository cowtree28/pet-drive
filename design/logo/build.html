<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Asta;src:url(../screens/fonts/AstaSans.ttf)}
body{margin:0;width:1920px;height:1080px;background:#F7F8FA;font-family:Asta;word-break:keep-all;display:flex;align-items:center;justify-content:center;color:#131417}
.c{width:1400px}
.k{font-size:30px;font-weight:700;color:#686A72}
.h{font-size:72px;font-weight:800;line-height:1.3;margin-top:22px;letter-spacing:-1.5px;text-wrap:balance}
.s{opacity:0;flex:1 1 0;min-width:0;display:flex}.s>.box{flex:1}.on{opacity:1}
.row{display:flex;gap:40px;margin-top:64px}
.box{flex:1 1 0;min-width:0;background:#FFFFFF;border-radius:28px;padding:44px 48px;box-shadow:0 0 0 1px #EDEEF2,0 8px 24px rgba(19,20,23,.04)}
.box .t{font-size:30px;color:#686A72;font-weight:700}

.box.no{background:#1D1E21;box-shadow:none}.box.no .t{color:#9C9EA6}.box.no .v{color:#fff}.box.no .d{color:#C7C9CE}
.one{font-size:60px;font-weight:700;color:#A4A8AE;margin-top:72px;letter-spacing:-1px}.one b{color:#131417;font-weight:800}.src{font-size:22px;color:#9C9EA6;margin-top:40px}
.big{font-size:180px;font-weight:800;letter-spacing:-6px;line-height:1;display:flex;align-items:flex-end}.roll{display:inline-block;height:180px;overflow:hidden}.strip{display:block;line-height:180px}
.big small{font-size:64px;letter-spacing:0;color:#686A72;font-weight:700}
.n{font-size:27px;color:#02C265;font-weight:700}
</style></head><body><div class="c" id="c"></div>
<script>
const [card,step,pp]=location.hash.slice(1).split('-');const n=+step;const P=pp===undefined?1:+pp;

const C={
a:`<div class="k">왜 필요할까요</div>

  <div class="big"><span class="roll"><span class="strip" style="transform:translateY(${-180*7*(1-P)}px)">7<br>6<br>5<br>4<br>3<br>2<br>1<br>0</span></span><small>/10</small></div>

 <div class="src">KB경영연구소 2021 (반려동물 외출 시 자가용 69.7%)</div>`,
b:`<div class="h" style="font-size:84px">차의 펫 모드가 챙기는 건<br>한 가지뿐입니다</div>
 ${S(1,`<div class="one"><b>달리는 동안</b>의 멀미는 아무도 챙기지 않습니다</div>`)}`,

c:`<div class="k">펫 드라이브는</div><div class="h">달리는 동안부터 세워 둘 때까지<br>차가 반려견을 챙깁니다</div>

 ${S(2,`<div class="box"><div class="n">위험해지면</div><div class="v">쉴 곳 안내</div><div class="d">반려견 놀이터가 있는 휴게소를 내비 경유지에 넣습니다</div></div>`)}
 ${S(3,`<div class="box"><div class="n">세워 두면</div><div class="v">차 안 지키기</div><div class="d">에어컨이 꺼지면 몇 분 뒤 위험한지 알리고 보호자를 부릅니다</div></div>`)}</div>`};
document.getElementById('c').innerHTML=C[card];
</script></body></html>
