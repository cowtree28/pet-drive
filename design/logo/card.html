<!doctype html><html><head><meta charset="utf-8"><style>

body{word-break:keep-all;margin:0;width:1920px;height:1080px;background:#F7F8FA;font-family:Asta;display:flex;align-items:center;justify-content:center}

</style></head><body><div class="c" id="c"></div>
<script>
const C={
 a:`<div class="k">왜 필요할까요</div><div class="big">반려견과 외출하는 보호자<br><em>10명 중 7명</em>은 자가용을 탑니다</div><div class="s">강아지는 차멀미를 자주 합니다. 하지만 운전하는 보호자는 앞만 봐야 해서<br>뒷좌석의 강아지가 힘들어하는지 알아채기 어렵습니다.</div><div class="src">KB경영연구소 2021 (반려동물 외출 시 자가용 69.7%), 한국관광공사 2022 (동반 여행 시 자가용 79.3%)</div>`,
 b:`<div class="k">지금 차는 무엇을 해 줄까요</div><div class="big">차의 펫 모드는<br><em>세워 둔 차</em>만 지킵니다</div><div class="s">테슬라, 현대·기아의 펫 모드는 주차 중 에어컨을 켜 두는 기능입니다.<br>달리는 동안 강아지의 멀미를 챙기는 기능은 없습니다.</div>`,
 c:`<div class="logo"><img src="logo.svg"><b>펫 드라이브는</b></div><div class="row">

 <div class="it"><div class="n">위험해지면</div><b>쉴 곳을 잡아 줍니다</b><span>반려견 놀이터가 있는 휴게소를 내비 경유지에 바로 넣습니다</span></div>
 <div class="it"><div class="n">잠깐 세워 두면</div><b>차 안을 지킵니다</b><span>에어컨이 꺼져 더워지면 몇 분 뒤 위험한지 알려 주고 보호자를 부릅니다</span></div></div>
